version: "3.8"

services:
  app_proxy:
    environment:
      APP_HOST: bch-rental-dashboard
      APP_PORT: 8501
    networks:
      - umbrel_main_network

  engine:
    image: bch-rental-engine:umbrel-test
    restart: unless-stopped
    volumes:
      - ${APP_DATA_DIR}/config:/root/bch_rental_engine/config
      - ${APP_DATA_DIR}/state:/root/bch_rental_engine/state
      - ${APP_DATA_DIR}/logs:/root/bch_rental_engine/logs

  dashboard:
    image: bch-rental-engine:umbrel-test
    networks:
      default:
        aliases:
          - bch-rental-dashboard
      umbrel_main_network:
        aliases:
          - bch-rental-dashboard
    command:
      - streamlit
      - run
      - dashboard/app.py
      - --server.port=8501
      - --server.address=0.0.0.0
    restart: unless-stopped
    depends_on:
      - engine
    volumes:
      - ${APP_DATA_DIR}/config:/root/bch_rental_engine/config
      - ${APP_DATA_DIR}/state:/root/bch_rental_engine/state


networks:
  umbrel_main_network:
    external: true
    name: umbrel_main_network
